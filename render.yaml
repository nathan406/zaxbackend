services:
  - type: web
    name: zax-backend
    env: python
  pythonVersion: 3.11
  buildCommand: "apt-get update && apt-get install -y build-essential libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev python3-tk tesseract-ocr libtesseract-dev libleptonica-dev poppler-utils && pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn zax_backend.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: postgresql://postgres.imqkngwpgvufvrdwalhx:e5k666fDk29aCEEu@aws-1-us-east-1.pooler.supabase.com:6543/postgres
      - key: ALLOWED_HOSTS
        value: "zaxbackend.onrender.com,zax-backend.onrender.com,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://zrabot.netlify.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"